<!DOCTYPE html>
<html style="height:100%;">
<head>
    <title>Full Screen PDF Viewer</title>
    <style>
        /* Reset margin and padding */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        /* Set iframe to fill the viewport */
        iframe {
            width: 100vw; /* 100% of the viewport width */
            height: 100vh; /* 100% of the viewport height */
            border: none; /* Remove default border */
        }
    </style>
</head>
<body>
    <iframe src="https://docs.google.com/viewer?url=https://akshays.me/Akshay_Danthi_resume_DS4.pdf&embedded=true"></iframe>
</body>
</html>
