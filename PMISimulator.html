<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Interview Simulator</title>
<link rel="stylesheet" href="PMISimulator.css">
</head>
<body>
<div class="container">
  <h1>Simulate PM interview</h1>
  
  <div class="toggle-container">
    <label class="toggle-label">Guided Mode
      <input type="checkbox" class="toggle-checkbox">
      <span class="toggle-switch"></span>
    </label>
  </div>
  
  <div class="toggle-container">
    <label class="toggle-label">Timer
      <input type="checkbox" class="toggle-checkbox">
      <span class="toggle-switch"></span>
    </label>
  </div>
  
  <button id="start-button" onclick="window.location.href='question.html'">Start</button>
</div>
<script src="PMISimulator.js"></script>
</body>
</html>
