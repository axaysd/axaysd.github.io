<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Interview Simulator</title>
<link rel="stylesheet" href="PMISimulator.css">
</head>
<body>
<div class="container">
  <h1>Simulate PM interview</h1>
  
  <div class="toggle-container">
    <input type="checkbox" id="guided-mode" class="toggle">
    <label for="guided-mode" class="toggle-btn">Guided Mode: OFF</label>
  </div>
  
  <div class="toggle-container">
    <input type="checkbox" id="timed-mode" class="toggle">
    <label for="timed-mode" class="toggle-btn">Timed Mode: OFF</label>
  </div>
  
  <button id="start-button">Start</button>
</div>
<script src="PMISimulator.js"></script>
</body>
</html>
