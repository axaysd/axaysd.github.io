<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Interview Simulator</title>
<link rel="stylesheet" href="PMISimulator.css">
</head>
<body>
<div class="container">
  <h1>Simulate PM interview</h1>
  <label for="guided-mode">Guided mode:</label>
  <input type="range" id="guided-mode" min="0" max="1">
  <label for="timed-mode">Timed mode:</label>
  <input type="range" id="timed-mode" min="0" max="1">
  <button id="start-button">Start</button>
</div>
<script src="script.js"></script>
</body>
</html>
