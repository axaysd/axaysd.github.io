<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Page</title>
<link rel="stylesheet" href="style_question.css">
<!-- Include Font Awesome for the paper plane icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="main-container">
    <div class="content-container">
      <div id="question-box">
        <!-- Content (question) will be displayed here -->
        <p>Question:</p>
      </div>
      <div class="input-container">
        <textarea id="user-input" placeholder="Enter your answer here..."></textarea>
        <button class="submit-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
